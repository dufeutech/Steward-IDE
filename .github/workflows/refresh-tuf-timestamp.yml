# Re-signs timestamp metadata on a schedule.
#
# TUF's freeze defense works by expiry: clients treat metadata past its expiry as
# unavailable-and-stale rather than up-to-date. That means a publisher with
# nothing to release must still re-sign, or its own quiet period looks to clients
# exactly like an attacker withholding updates. Timestamp expiry is 14 days and
# this runs weekly, so one missed run is recoverable before clients notice.
name: refresh-tuf-timestamp

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # The public repository GitHub Pages serves the signed tree from — see
  # publish-pack.yml for why it is separate from this one.
  PACKS_REPO: dufeutech/steward-packs
  PACKS_BRANCH: main
  TUF_SUBDIR: tuf

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # re-enable this schedule (keepalive step below)
    steps:
      - uses: actions/checkout@v5

      - name: Check out the published repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PACKS_REPO }}
          ref: ${{ env.PACKS_BRANCH }}
          path: published
          ssh-key: ${{ secrets.PACKS_DEPLOY_KEY }}

      - name: Stop if nothing has been published yet
        id: guard
        run: |
          if [ -f "published/$TUF_SUBDIR/metadata/timestamp.json" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no published repository yet — nothing to refresh"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.guard.outputs.proceed == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.proceed == 'true'

      - name: Cache tuftool
        if: steps.guard.outputs.proceed == 'true'
        id: tuftool-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tuftool
          key: tuftool-${{ runner.os }}-v1

      - name: Install tuftool
        if: steps.guard.outputs.proceed == 'true' && steps.tuftool-cache.outputs.cache-hit != 'true'
        run: cd scripts/go && go run ./cmd/ensure tuftool --method cargo

      - name: Re-sign timestamp
        if: steps.guard.outputs.proceed == 'true'
        working-directory: scripts/py
        env:
          PACKPUB_SIGNING_KEY: ${{ secrets.PACKPUB_SIGNING_KEY }}
        run: |
          metadata="../../published/$TUF_SUBDIR/metadata"
          next=$(( $(jq -r '.signed.version' "$metadata/timestamp.json") + 1 ))
          uv run --package packpub packpub refresh ../../refreshed \
            --root-json ../../app/src-tauri/tuf/root.json \
            --metadata-url "file://$(realpath "$metadata")/" \
            --version "$next"

      - name: Publish the refreshed metadata
        if: steps.guard.outputs.proceed == 'true'
        run: |
          # tuftool writes metadata/ and targets/ under its outdir. Only metadata is
          # refreshed here — no target changed — so only metadata is copied across.
          cp refreshed/metadata/*.json "published/$TUF_SUBDIR/metadata/"
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refresh TUF metadata" || { echo "metadata unchanged"; exit 0; }
          git push origin "HEAD:$PACKS_BRANCH"

      # GitHub disables scheduled workflows in repositories with no activity for
      # 60 days. This keeps the schedule alive in a quiet repository, which is
      # precisely the situation the refresh exists for.
      - name: Keep the schedule alive
        if: always()
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-tuf-timestamp.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}

  # Root expiry is the one date no workflow can fix for you: renewing it needs the
  # offline root key, which deliberately is not here. What *can* be automated is
  # never having to remember — this rides the same weekly schedule and raises a
  # tracking issue while there is still time to act.
  #
  # This is the shape mature TUF tooling settles on: `tuf-on-ci` runs an equivalent
  # "create signing events for offline signed metadata that is about to expire"
  # job, and Sigstore's own trust root is renewed by a human with a hardware key
  # off the back of it. Detection is automatable; the signature is the point that
  # is not.
  #
  # Separate job so an expiring anchor never blocks the freshness re-signing above:
  # a stale timestamp is an outage, an approaching root expiry is a warning.
  anchor-expiry:
    name: anchor expiry watch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open/comment/close the tracking issue below
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      # Built here so the check below captures the anchor report alone. Left to
      # `uv run`, the first invocation prints venv creation and package downloads
      # into the same stream, and that noise ends up in the issue body ahead of
      # the one line that matters.
      - name: Build packpub
        working-directory: scripts/py
        run: uv sync --package packpub

      - name: Check the committed anchor
        id: anchor
        working-directory: scripts/py
        run: |
          # Non-zero once expiry is inside the renewal margin, or on any posture
          # problem. Captured rather than failing the step so the issue below can
          # carry the report.
          if report=$(uv run --package packpub packpub check-anchor 2>&1); then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$report"
          {
            echo "report<<REPORT_EOF"
            echo "$report"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.anchor.outputs.ok }}
          REPORT: ${{ steps.anchor.outputs.report }}
          LABEL: root-expiry
        run: |
          existing=$(gh issue list --label "$LABEL" --state open --json number \
            --jq '.[0].number // empty')

          if [ "$OK" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "Anchor is healthy again — renewed and outside the margin."
            fi
            exit 0
          fi

          body=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            "The committed trust anchor needs attention. Renewing it requires the offline root key and cannot be automated — see \`docs/runbooks/tuf-root-ceremony.md\`." \
            "$REPORT" \
            "This issue closes itself once the anchor passes again.")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create "$LABEL" --description "TUF trust anchor renewal" --color FBCA04 2>/dev/null || true
            gh issue create --label "$LABEL" \
              --title "TUF root anchor needs renewing" --body "$body"
          fi
