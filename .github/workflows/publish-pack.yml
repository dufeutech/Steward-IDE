# Publishes a signed pack release to the public artifact repository.
#
# What gets published is whatever the committed manifest pins: the payload is
# fetched from the origin that manifest records and verified against it before
# anything is signed. Publishing a new pack version therefore means committing an
# updated manifest first, then running this workflow — the repository stays the
# source of truth about what is live.
#
# The signed tree lives in a separate public repository (PACKS_REPO) because this
# one is private, and GitHub Pages cannot serve a private repository on the Free
# plan. Separation is the better shape regardless: the publishing surface is a
# minimal public artifact repo, not the source. Write access is one deploy key,
# scoped to that repo alone — see docs/runbooks/pack-publishing.md.
name: publish-pack

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Baseline pack directory name (under app/src-tauri/packs-baseline/)
        required: true
        default: xkin

permissions:
  contents: read

env:
  PACK_DIR: app/src-tauri/packs-baseline/${{ inputs.pack }}
  # The public repository GitHub Pages serves the signed tree from.
  PACKS_REPO: dufeutech/steward-packs
  PACKS_BRANCH: main
  # Where the signed repository lives inside that branch.
  TUF_SUBDIR: tuf

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out this repository; the artifact repo uses a deploy key
      id-token: write # provenance attestation (keyless signing)
      attestations: write
    steps:
      - uses: actions/checkout@v5

      # Deliberately not fault-tolerant: the runbook creates this repository with an
      # initial commit before the first publish, so a failure here means the hosting
      # setup is wrong and publishing anyway would sign into the void.
      - name: Check out the published repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PACKS_REPO }}
          ref: ${{ env.PACKS_BRANCH }}
          path: published
          ssh-key: ${{ secrets.PACKS_DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache tuftool
        id: tuftool-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tuftool
          key: tuftool-${{ runner.os }}-v1

      - name: Install tuftool
        if: steps.tuftool-cache.outputs.cache-hit != 'true'
        run: cd scripts/go && go run ./cmd/ensure tuftool --method cargo

      - name: Fetch and verify the pack payload
        working-directory: scripts/py
        run: uv run --package packpub packpub baseline ../../$PACK_DIR

      - name: Decide create-vs-update and the next metadata version
        id: state
        run: |
          metadata="published/$TUF_SUBDIR/metadata"
          if [ -f "$metadata/timestamp.json" ]; then
            current=$(jq -r '.signed.version' "$metadata/timestamp.json")
            echo "metadata_url=file://$(realpath "$metadata")/" >> "$GITHUB_OUTPUT"
            echo "version=$((current + 1))" >> "$GITHUB_OUTPUT"
          else
            echo "metadata_url=" >> "$GITHUB_OUTPUT"
            echo "version=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and sign the release
        working-directory: scripts/py
        env:
          PACKPUB_SIGNING_KEY: ${{ secrets.PACKPUB_SIGNING_KEY }}
        run: |
          uv run --package packpub packpub publish \
            ../../$PACK_DIR/manifest.json \
            ../../$PACK_DIR \
            ../../signed \
            --root-json ../../app/src-tauri/tuf/root.json \
            --version ${{ steps.state.outputs.version }} \
            ${{ steps.state.outputs.metadata_url && format('--metadata-url {0}', steps.state.outputs.metadata_url) || '' }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: signed/metadata/*.json

      # One commit publishes metadata and targets together, so clients never see a
      # repository whose metadata and content come from different releases.
      - name: Publish to the artifact repository
        run: |
          rm -rf "published/$TUF_SUBDIR"
          mkdir -p "published/$TUF_SUBDIR"
          cp -r signed/* "published/$TUF_SUBDIR/"
          # Pages runs Jekyll over a branch deploy unless told otherwise. TUF metadata
          # must be served byte-for-byte or every signature check fails.
          touch published/.nojekyll
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publish ${{ inputs.pack }} (metadata v${{ steps.state.outputs.version }})" || {
            echo "nothing to publish"; exit 0;
          }
          git push origin "HEAD:$PACKS_BRANCH"
