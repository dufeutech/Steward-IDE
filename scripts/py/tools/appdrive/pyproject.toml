[project]
name = "appdrive"
version = "0.1.0"
description = "Drive a running desktop window on Windows: focus, keys, clicks, and window captures"
requires-python = ">=3.12"
dependencies = ["cyclopts>=4.0", "pillow>=11.0"]

[project.scripts]
appdrive = "appdrive.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
