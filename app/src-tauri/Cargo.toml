[package]
name = "steward-ide"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "steward_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# asset-pack-system (see openspec change; ADRs in its design.md)
sha2 = "0.10"
jsonschema = "0.33"
semver = { version = "1", features = ["serde"] }
# `http` is off by default and the updater's endpoint is https — without it the
# default transport rejects the URL scheme outright and no release can ever be
# fetched. The fixture tests load over `file://`, which needs no feature, so
# nothing caught this until the app ran against the real endpoint.
tough = { version = "0.24", features = ["http"] }
# terminal-surface (ADR "Pseudo-terminal and child-process control"). One dependency
# covering ConPTY and Unix `openpty` behind a single trait. `std::process::Command`
# allocates no TTY at all — programs line-buffer, drop colour, and full-screen programs
# do not run — so it fails the `terminal-session` spec outright rather than merely being
# less convenient. Isolated in `adapters/pty.rs`; no `portable_pty` type reaches the core.
portable-pty = "0.9"
# Picking among the configured shell candidates needs a PATH lookup, not a
# `Path::exists` — `pwsh.exe` is a bare name, not a path, so the obvious check
# answers "no" on a machine that has it. `which` is the 390M-download standard for
# exactly this, including Windows' PATHEXT rules, which is where a hand-rolled
# version would quietly get it wrong.
which = "8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
# Building `file://` URLs for the fixture repository: drive letters and
# percent-encoding are not worth hand-rolling. Already in the tree via `tough`.
url = "2"

